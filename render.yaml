services:
  - type: web
    name: paodekuai-scorekeeper
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: paodekuai-data
      mountPath: /var/data
      sizeGB: 1
